<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Band‑Aid – Initial Setup</title>

  <style>
    :root {
      --blue: #0d6efd;
      --bg: #f8f9fa;
      --border: #dee2e6;
      --muted: #6c757d;
    }
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 3rem;
      color: var(--blue);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    .box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .muted {
      color: var(--muted);
    }
    .progress {
      width: 100%;
      background: #e9ecef;
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      margin-top: .5rem;
    }
    .bar {
      height: 100%;
      background: var(--blue);
      width: 0;
      transition: width .2s ease;
    }
    .logs {
      margin-top: 1rem;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .92rem;
      white-space: pre-wrap;
      color: #0b4e9a;
    }
  </style>
</head>

<body>

  <h1>Band‑Aid – Preparing your first run</h1>

  <div class="box">
    <p id="msg">Starting…</p>

    <div class="progress">
      <div id="bar" class="bar" style="width:0%"></div>
    </div>

    <p class="muted">
      Please keep this tab open. The first setup can take 20–40 minutes depending on your network speed.
    </p>

    <div id="logs" class="logs"></div>
  </div>

  <script>
    /*
      The R launcher writes into location.hash something like:

      #{"msg":"Checking shiny","pct":42,"logs":"...","redirect":"http://127.0.0.1:8787"}

      We read that here for display + for performing the redirect.
    */
    function readHashData() {
      try {
        return JSON.parse(decodeURIComponent(location.hash.substring(1)));
      } catch (e) {
        return {};
      }
    }

    const data = readHashData();

    // Update UI fields if present
    if (data.msg)  document.getElementById("msg").textContent = data.msg;
    if (data.logs) document.getElementById("logs").textContent = data.logs;
    if (typeof data.pct === "number") {
      document.getElementById("bar").style.width = Math.max(0, Math.min(100, data.pct)) + "%";
    }

    /*
      POLLING REDIRECT LOGIC — avoids the “port not available” error.

      We ping the redirect URL every second using an <img> element.
      When ANY response comes back (even 404), we redirect.
      That means the Shiny server is finally reachable.
    */
    const target = data.redirect;  // e.g. "http://127.0.0.1:8787"

    function waitForServer() {
      if (!target) return; // R hasn't set redirect yet

      const img = new Image();

      img.onload = () => {
        // Server is reachable → redirect!
        window.location.href = target;
      };

      img.onerror = () => {
        // Server not ready yet → try again in 1s
        setTimeout(waitForServer, 1000);
      };

      // Cache-buster
      img.src = target + "/__ping__?_=" + Date.now();
    }

    // Start checking for app availability
    waitForServer();

  </script>

</body>
</html>
